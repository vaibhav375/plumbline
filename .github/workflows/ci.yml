name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  checker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/checker
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr && tesseract --version | head -1
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t checker services/checker
      - name: Image under 1.2 GB
        run: |
          size=$(docker image inspect checker --format '{{.Size}}')
          echo "image size: $((size / 1024 / 1024)) MB"
          test "$size" -lt 1288490188
      - name: Container boots, OCR works, no secrets inside
        run: |
          docker run --rm checker python -c "import pytesseract; print('tesseract', pytesseract.get_tesseract_version())"
          docker run --rm checker sh -c 'test ! -e /app/.env && test ! -d /app/tests'
          docker run -d --name checker-test -p 8000:8000 -e SUPABASE_URL=https://example.supabase.co -e SUPABASE_ANON_KEY=x checker
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf localhost:8000/health | grep -q '"status":"ok"'

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/web/pnpm-lock.yaml
      - run: cmp apps/web/lib/samples.json supabase/seed/aurelle/contents.json  # web copy must match the seed
      - run: pnpm -C apps/web install --frozen-lockfile
      - run: pnpm -C apps/web lint
      - run: pnpm -C apps/web typecheck
      - run: pnpm -C apps/web build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
