[project]
name = "plumbline"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "en-core-web-sm",
    "fastapi==0.159.1",
    "httpx==0.28.1",
    "pdfplumber==0.11.10",
    "pillow==13.0.0",
    "presidio-analyzer==2.2.364",
    "pydantic-settings==2.16.1",
    "pyjwt[crypto]==2.15.1",
    "pytesseract==0.3.13",
    "python-docx==1.2.0",
    "python-multipart==0.0.32",
    "rapidfuzz==3.14.6",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "psycopg[binary]==3.3.6",
    "pypdf==6.21.2",
    "pytest==9.1.1",
    "respx==0.23.1",
    "ruff==0.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["db: needs the plumbline-test Supabase project"]
addopts = "-m 'not db'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# The formatter wraps code at 100; it never splits string literals (prompts, messages), so E501
# would only flag those.
ignore = ["E501"]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
